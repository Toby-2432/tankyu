name: Build C++ Extension

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pybind11

    - name: Compile C++ extension
      run: |
        g++ -O3 -Wall -shared -std=c++11 -fPIC $(python3 -m pybind11 --includes) gacha_sim_cpp.cpp -o gacha_sim_cpp.so

    - name: Commit compiled file
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add gacha_sim_cpp.so
        git commit -m "Auto-compile C++ extension" || echo "No changes to commit"
        git push
